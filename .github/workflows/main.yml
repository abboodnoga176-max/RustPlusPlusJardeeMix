name: Deploy Rust++ to Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalacja paczek
        run: npm install --legacy-peer-deps

      - name: Kompilacja do JavaScript
        run: npx tsc

      - name: Naprawa błędnych importów .ts na .js
        run: |
          find dist -type f -name "*.js" -exec sed -i 's/\.ts"/\.js"/g' {} +
          find dist -type f -name "*.js" -exec sed -i "s/\.ts'/\.js'/g" {} +

      - name: Usunięcie paczek dev
        run: npm prune --production --legacy-peer-deps

      - name: Pakowanie plików do jednego archiwum (Mega przyspieszenie)
        run: |
          mkdir deploy_package
          tar -czf deploy_package/build.tar.gz dist node_modules package.json

      - name: Wysłanie archiwum przez SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy_package/' # Wysyłamy tylko folder z archiwum
          remote_path: '/'
          sftp_only: true
          args: '-o ConnectTimeout=5'
